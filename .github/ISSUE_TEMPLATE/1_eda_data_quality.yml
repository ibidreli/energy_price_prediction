name: "📊 Exploratory Data Analysis & Data Quality"
description: "Propose or document exploratory data analysis, data quality checks, or distribution findings"
title: "[EDA]: "
labels: ["type: eda", "area: data"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue template for exploratory data analysis (EDA), assessing data quality, analyzing distributions, or investigating anomalies.
        *Remember:* Check [docs/data.md](file:///Users/lucamanna/Documents/00_Coding/fhnw/11_Praxismodule/energy_price_prediction/docs/data.md) for data availability cutoffs (D-1 11:00).
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset / Data Source
      description: Which dataset or table is the subject of this analysis?
      options:
        - "Swissgrid Balance Prices (aep_ct_kwh / regime)"
        - "Swissgrid Control Area Balance (CAB / snapshots)"
        - "ECMWF Weather Forecasts (6 sites)"
        - "Cantonal Solar PV Capacity & Holidays"
        - "Energy-Charts / BFE Reservoir Filling Levels (weekly)"
        - "Cross-dataset / Combined Feature Matrix"
        - "New / External Data Source"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Analysis Objective & Hypothesis
      description: What specific questions or hypotheses are being investigated?
      placeholder: "e.g. Investigate how solar radiation forecasts at Mittelland sites correlate with negative balance energy prices across seasons."
    validations:
      required: true
