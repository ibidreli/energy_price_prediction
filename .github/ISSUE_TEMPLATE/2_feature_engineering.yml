name: "⚙️ Feature Engineering & Preprocessing"
description: "Propose, design, or implement new features or data transformations"
title: "[FEAT]: "
labels: ["type: feature", "area: features"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue template when adding new feature transformers, calendar features, weather aggregations, or lag features.
        *Strict Leakage Rule:* All features for day D must be derivable from information published before D-1 11:00 (Swissgrid <= D-2 24:00, Weather <= D-2 18 UTC).
  - type: input
    id: feature_name
    attributes:
      label: Feature Name(s) / Identifier
      description: Name of the feature(s) or transformer module.
      placeholder: "e.g. pv_weighted_solar_ghi_d_minus_2_lag, rolling_cab_mean_48h"
    validations:
      required: true
  - type: dropdown
    id: feature_category
    attributes:
      label: Feature Category
      options:
        - "Calendar & Holiday (cyclical hour/dow, cantonal holidays, DST)"
        - "Weather Forecast (ECMWF solar radiation, wind, temp, cloud cover)"
        - "Swissgrid Historical CAB (Control Area Balance lags & rolling stats)"
        - "Swissgrid Historical Prices (AEP lags, volatility, price regime)"
        - "Interaction / Non-linear combination"
        - "External / Macro / Commodity"
    validations:
      required: true
  - type: textarea
    id: domain_rationale
    attributes:
      label: Domain Rationale & Intuition
      description: Why is this feature expected to improve predictive power for balance energy prices or uncertainty?
      placeholder: "e.g. High forecasted solar generation in cantons with large PV capacity increases risk of grid surplus (positive balance) driving prices down or negative."
    validations:
      required: true
