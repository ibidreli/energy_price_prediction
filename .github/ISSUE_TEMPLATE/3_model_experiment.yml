name: "🧪 Modeling & Experimentation"
description: "Plan, track, and document model training, tuning, or benchmarking experiments"
title: "[EXP]: "
labels: ["type: experiment", "area: modeling"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for training models, comparing architectures, running hyperparameter optimization, and evaluating uncertainty bounds.
        *Challenge Requirement:* Point forecast + uncertainty measure per forecast (e.g. 10th/90th percentiles or prediction intervals).
  - type: input
    id: model_name
    attributes:
      label: Model Architecture / Strategy Name
      description: Short name for the model family or approach.
      placeholder: "e.g. LightGBM Quantile Regressor, Conformal Ridge, Temporal Fusion Transformer baseline"
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Experiment Hypothesis
      description: What are we testing and what performance or uncertainty calibration improvement do we expect?
      placeholder: "e.g. Tree-based gradient boosting using lagged CAB and PV forecast features will reduce pinball loss on extreme price spikes compared to the persistence baseline."
    validations:
      required: true
  - type: textarea
    id: outcome_summary
    attributes:
      label: Results & Decision (Fill upon completion)
      description: Document final validation metrics and whether this model is adopted.
      placeholder: "Fill before closing issue: MAE = ..., 80% Coverage = ...%, Decision: Promoted to benchmark / Rejected."
